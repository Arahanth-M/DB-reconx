# TICKET-ADV149 — Prometheus scrape config
# Host-run backend (./mvnw spring-boot:run) is scraped via host.docker.internal.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'reconx-backend'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
